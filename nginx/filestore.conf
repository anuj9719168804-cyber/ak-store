# File-Store-Pro behind nginx (VPS).
#   1. Replace yourdomain.com and the certificate paths.
#   2. proxy_pass port = PORT (default 5010, or the value your host injects).
#   3. Set WEB_URL=https://yourdomain.com for the bot.
#   4. The /file/ location must match STREAM_PATH (default /file).

server {
    listen 80;
    server_name yourdomain.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;   # nginx >= 1.25.1: use "listen 443 ssl;" plus "http2 on;"
    server_name yourdomain.com;

    ssl_certificate     /etc/letsencrypt/live/yourdomain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/yourdomain.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    add_header X-Content-Type-Options nosniff;
    add_header Referrer-Policy no-referrer;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Nothing is uploaded over HTTP (files go through Telegram)
    client_max_body_size 1m;

    # Optional: let nginx serve the panel's CSS itself (adjust the path)
    location /static/ {
        alias /opt/File-store-Pro/web/static/;
        expires 30d;
    }

    # Streaming: no buffering (starts instantly, seeking works), long timeouts.
    # Range requests are forwarded untouched.
    location /file/ {
        proxy_pass http://127.0.0.1:5010;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # Watch page + admin panel
    location / {
        proxy_pass http://127.0.0.1:5010;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # The panel uses this to rate-limit password guesses per visitor
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}
