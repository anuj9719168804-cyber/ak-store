<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>{{ name }}</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex">
    <style>
        body { margin: 0; background: #0f1115; color: #eee; font-family: system-ui, sans-serif;
               display: flex; flex-direction: column; align-items: center; padding: 16px; }
        h1 { font-size: 1rem; font-weight: 500; word-break: break-all; text-align: center; }
        p { color: #94a3b8; font-size: .85rem; }
        video, audio { width: 100%; max-width: 960px; border-radius: 8px; background: #000; }
        a.btn { margin-top: 16px; padding: 10px 18px; border-radius: 8px; background: #2b7fff;
                color: #fff; text-decoration: none; }
    </style>
</head>
<body>
    <h1>{{ name }}</h1>
    {% if size %}<p>{{ size }}</p>{% endif %}

    {% if kind == "audio" %}
    <audio controls preload="metadata" src="{{ stream_path }}/{{ ref }}?{{ qs }}"></audio>
    {% elif kind == "video" %}
    <video controls playsinline preload="metadata">
        <source src="{{ stream_path }}/{{ ref }}?{{ qs }}"{% if mime %} type="{{ mime }}"{% endif %}>
    </video>
    {% else %}
    <p>No preview for this file type.</p>
    {% endif %}

    <a class="btn" href="{{ stream_path }}/{{ ref }}?{{ qs }}&amp;download=1">⬇️ Download</a>
</body>
</html>
