<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Admin Login - Verification</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="/static/style.css">
</head>
<body class="login-page">

<form method="POST" class="login-box">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <h2>Verification code</h2>
    <p class="hint" style="margin-bottom:12px">A 6-digit code was sent to the owner on Telegram. It is valid for 5 minutes.</p>
    {% if error %}<p style="color:#f87171;margin-bottom:12px">{{ error }}</p>{% endif %}
    <input type="text" name="code" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" maxlength="6" placeholder="123456" required autofocus>
    <button type="submit">Verify</button>
    <p style="margin-top:14px"><a href="{{ panel }}/login" style="color:var(--accent);font-size:14px">Start over</a></p>
</form>

</body>
</html>
