<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex, nofollow">
    <title>{% block title %}Verification{% endblock %}</title>
    <style>
        :root { --bg:#f4f5f7; --card:#fff; --text:#1c1e21; --muted:#6b7280; --accent:#2a7de1; --ok:#1f9d55; --err:#d64545; --border:#e3e5e8; }
        @media (prefers-color-scheme: dark) {
            :root { --bg:#14161a; --card:#1d2026; --text:#e8eaed; --muted:#9aa0a6; --border:#2c3038; }
        }
        * { box-sizing: border-box; }
        body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center; padding:20px;
               background:var(--bg); color:var(--text); font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; }
        .card { width:100%; max-width:420px; background:var(--card); border:1px solid var(--border); border-radius:16px;
                padding:28px 24px; text-align:center; box-shadow:0 6px 24px rgba(0,0,0,.06); }
        h1 { font-size:20px; margin:12px 0 6px; }
        p { margin:6px 0; color:var(--muted); }
        .icon { font-size:44px; line-height:1; }
        .bar { height:6px; background:var(--border); border-radius:99px; overflow:hidden; margin:18px 0 6px; }
        .bar > i { display:block; height:100%; width:30%; background:var(--accent); border-radius:99px; animation:slide 1.2s ease-in-out infinite; }
        @keyframes slide { 0% { margin-left:-30%; } 100% { margin-left:100%; } }
        .btn { display:inline-block; margin-top:16px; padding:13px 26px; border:0; border-radius:12px; background:var(--accent); color:#fff;
               font-size:16px; font-weight:600; text-decoration:none; cursor:pointer; }
        .btn[disabled] { opacity:.45; cursor:not-allowed; }
        .ok { color:var(--ok); } .err { color:var(--err); }
        .small { font-size:13px; }
    </style>
</head>
<body>
<div class="card">
    {% block body %}{% endblock %}
</div>
<noscript>
    <style>.card > :not(.nojs) { display:none !important; }</style>
    <div class="card nojs" style="position:fixed;left:50%;top:50%;transform:translate(-50%,-50%)">
        <div class="icon">⚠️</div><h1>JavaScript is off</h1>
        <p>Turn on JavaScript for this site: the browser check cannot run without it.</p>
    </div>
</noscript>
</body>
</html>
